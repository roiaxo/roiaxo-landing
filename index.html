<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>roiaxo.com | قريباً</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Tahoma, Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 15% 20%, #6848d9 0, transparent 32%),
        radial-gradient(circle at 85% 80%, #159b83 0, transparent 30%),
        #0b1020;
    }

    .card {
      width: min(680px, 100%);
      padding: 56px 32px;
      text-align: center;
      border: 1px solid #ffffff24;
      border-radius: 28px;
      background: #ffffff12;
      box-shadow: 0 24px 80px #00000059;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 22px;
      font-size: 28px;
      font-weight: bold;
      background: linear-gradient(135deg, #7c5cff, #19d3ae);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 64px;
    }

    h2 {
      margin: 0 0 18px;
      font-size: 28px;
      font-weight: normal;
    }

    p {
      margin: auto;
      max-width: 500px;
      color: #b8c1d9;
      font-size: 18px;
      line-height: 1.9;
    }

    .domain {
      margin-top: 30px;
      font-size: 17px;
      letter-spacing: 1px;
    }

    footer {
      margin-top: 34px;
      color: #b8c1d9;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">R</div>
    <h1>قريباً</h1>
    <h2>نحن نجهّز شيئاً مميزاً لك</h2>
    <p>
      الموقع قيد التجهيز حالياً.
      ترقّبوا إطلاقنا قريباً، وشكراً لزيارتكم.
    </p>
    <div class="domain">roiaxo.com</div>
    <footer>© 2026 roiaxo.com</footer>
  </main>
</body>
</html>
